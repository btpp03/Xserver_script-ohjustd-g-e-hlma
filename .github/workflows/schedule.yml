name: XServer Extend Schedule

on:
  workflow_dispatch: # 由外部 cron-job (北京 08:00 / 20:00) 触发

jobs:
  extend-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install seleniumbase pyvirtualdisplay requests
        sudo apt-get update -qq && sudo apt-get install -y -qq jq xvfb > /dev/null 2>&1

    - name: Setup proxy tunnel (optional)
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        chmod +x setup_proxy.sh
        if ! bash setup_proxy.sh; then
          echo "❌ Proxy setup failed (直连模式继续)"
        fi

    - name: Run Extension Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        PROXY_SERVER: ${{ env.PROXY_SERVER }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python xserver_renew.py

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: "output/screenshots/*.png"
        retention-days: 5
        if-no-files-found: ignore
